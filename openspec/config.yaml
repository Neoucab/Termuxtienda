# SDD workspace configuration — generated by sdd-init on 2026-09-15
context: |
  Project: termuxtienda — PWA POS for a clothing store, dual-currency (VES/USD), Venezuela.
  Stack: TypeScript 5 (strict), React 18, Vite 5, Zustand 5, React Router 6, Tailwind 3, Recharts.
  Backend: Convex (convex/ — schema, lib, mutations, snapshot) inside the same package; no workspaces.
  Tests: Vitest 4 unit tests in src/lib/*.test.ts; localStorage polyfill in src/test/setup.ts is
  imported directly by tests (no vitest test block in vite.config.ts, no vitest.config.ts).
  Component (integration-layer) tests run under the same `npm test` command through Vitest +
  @testing-library/react in jsdom, opted in per file with a `// @vitest-environment jsdom`
  docblock (node stays the default); their shared DOM harness is src/test/setup.dom.ts, which
  each component test imports before @testing-library/react because that harness normalizes
  NODE_ENV before React loads — the import order is a documented dependency, not incidental.
strict_tdd: true
strict_tdd_basis: >
  No explicit marker/config found. Defaulted to true because the discovered
  project set is non-empty (single project at the repository root) and one
  explicit workspace-level test command (npm test -> vitest run) defined in
  the root package.json covers every in-scope project.
projects:
  - path: "."
    stack: "TypeScript 5 (strict) + React 18 + Vite 5 + Zustand + Tailwind + Convex backend"
    manifest: "package.json"
    test_command: "npm test (vitest run)"
    test_framework: "vitest"
    typecheck_command: "npm run typecheck (tsc --noEmit)"
    lint_command: null
    format_command: null
    coverage_command: null
    test_layers:
      unit: true
      integration: true
      e2e: false
phase_rules:
  proposal: "Proposals live in openspec/changes/<change-id>/proposal.md; explore first via sdd-explore when intent is unclear."
  spec: "Delta specs in openspec/changes/<change-id>/specs/<capability>/spec.md; scenarios written as WHEN/THEN requirements."
  design: "Design in openspec/changes/<change-id>/design.md; record decisions, alternatives, and tradeoffs."
  tasks: "Implementation checklist in openspec/changes/<change-id>/tasks.md; atomic, verifiable work units."
  apply: "Implement one task at a time; keep tests with code; mark task status as work completes."
  verify: "Run npm test and npm run typecheck; prove each spec scenario before archiving."
  archive: "Merge delta specs into openspec/specs/ and move the change to openspec/changes/archive/."
